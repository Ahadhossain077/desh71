<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Admin Login | Desh 71</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../style.css">
  <link rel="stylesheet" href="../assets/css/pages.css">

  <style>
    .admin-login-body {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #f5f7fb;
      margin: 0;
      font-family: "DM Sans", "Hind Siliguri", sans-serif;
    }
    .admin-login-card {
      width: 100%;
      max-width: 420px;
      padding: 40px 30px;
      background: #ffffff;
      border-radius: 16px;
      box-shadow: 0 10px 30px rgba(23, 35, 60, 0.08);
      margin: 20px;
    }
    .admin-login-brand {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 30px;
      text-decoration: none;
      color: #0f1a33;
    }
    .admin-login-brand-mark {
      display: grid;
      place-items: center;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      background: linear-gradient(135deg, #315efb, #5b83ff);
      color: #fff;
      font-size: 24px;
      font-weight: 700;
    }
    .admin-login-brand strong {
      font-size: 20px;
      letter-spacing: 1.5px;
    }
    .admin-login-card h1 {
      text-align: center;
      font-size: 20px;
      margin-bottom: 25px;
      color: #17233c;
    }
    .admin-login-field {
      display: grid;
      gap: 6px;
      margin-bottom: 18px;
    }
    .admin-login-field label {
      font-size: 12px;
      font-weight: 700;
      color: #46536a;
    }
    .admin-login-field input {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid #e9edf4;
      border-radius: 10px;
      background: #fbfcfe;
      font-size: 16px;
      font-family: inherit;
      outline: none;
      transition: .2s;
      box-sizing: border-box;
    }
    .admin-login-field input:focus {
      border-color: #315efb;
      background: #fff;
      box-shadow: 0 0 0 4px rgba(49, 94, 251, 0.1);
    }
    .admin-login-btn {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      background: #315efb;
      color: #fff;
      border: 0;
      border-radius: 10px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }
    .admin-login-btn:hover {
      background: #1f4eed;
      transform: translateY(-1px);
    }
    .admin-login-btn:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
  </style>
</head>
<body class="admin-login-body">

  <div class="admin-login-card">
    <a href="../index.html" class="admin-login-brand">
      <span class="admin-login-brand-mark">৭১</span>
      <strong>DESH 71</strong>
    </a>

    <h1>Newsroom Admin Login</h1>

    <form id="loginForm">
      <div class="admin-login-field">
        <label for="email">Email Address</label>
        <input type="email" id="email" name="email" required placeholder="admin@desh71.com" autocomplete="email">
      </div>

      <div class="admin-login-field">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" required placeholder="••••••••" autocomplete="current-password">
      </div>

      <button type="submit" class="admin-login-btn">Sign In</button>
      
      <p id="formMessage" class="form-message" style="text-align: center; margin-top: 15px;"></p>
    </form>
  </div>

  <script type="module" src="../assets/js/admin.js"></script>
</body>
</html>
