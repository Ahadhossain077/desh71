<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex"><title>Article editor | Desh 71 Admin</title><link rel="stylesheet" href="../style.css"><link rel="stylesheet" href="../assets/css/pages.css"></head><body class="admin-body"><header class="admin-top"><a class="brand" href="../index.html"><span class="brand-mark">৭১</span><span><strong>DESH 71</strong><small>Admin</small></span></a><button id="signOut" class="header-btn">Sign out</button></header><main class="admin-content"><a class="back-link" href="articles.html">← Articles</a><h1 id="editorHeading">Create article</h1><form id="articleForm" class="admin-card admin-form"><label>Title (Bangla)<input name="title_bn" required maxlength="300"></label><label>Title (English)<input name="title_en" required maxlength="300"></label><label>Summary (Bangla)<textarea name="summary_bn" required rows="3"></textarea></label><label>Summary (English)<textarea name="summary_en" required rows="3"></textarea></label><label>Article body (Bangla)<textarea name="content_bn" required rows="10"></textarea></label><label>Article body (English)<textarea name="content_en" required rows="10"></textarea></label><label>Category<select name="category_id" id="categorySelect" required><option value="">Loading categories…</option></select></label><label>Author<input name="author_name" maxlength="160"></label><label>Image URL (optional)<input name="image_url" type="url" placeholder="https://…"></label><label>Status<select name="status"><option value="draft">Draft</option><option value="published">Published</option></select></label><button class="primary-button" type="submit">Save article</button><p id="formMessage" class="form-message" role="status"></p></form></main><script type="module" src="../assets/js/admin.js"></script></body></html>
